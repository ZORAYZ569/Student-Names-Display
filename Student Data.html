<!DOCTYPE html>
<html>
<head>
    <title>Student Names</title>
</head>
<body>
    <h2>Five Student Names</h2>

    <script>
        let students = [
            "Rahul",
            "Aman",
            "Zoya",
            "Ali",
            "Sara"
        ];

        document.write("<ul>");

        for (let name of students) {
            document.write("<li>" + name + "</li>");
        }

        document.write("</ul>");
    </script>
</body>
</html>
